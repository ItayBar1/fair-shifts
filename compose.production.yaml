# Production and synthetic staging on a single Ubuntu host. Separate from the
# development compose.yaml: no secrets in the repository and no published ports.
# The site is reachable only through cloudflared. Use via scripts/production.sh;
# operating instructions in docs/operations.md.
name: fair-shifts-production

x-service: &service
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "5" }

x-app: &app
  <<: *service
  image: fair-shifts:${APP_VERSION:?APP_VERSION is required}
  env_file:
    - path: ${FAIR_SHIFTS_CONFIG_DIR:?FAIR_SHIFTS_CONFIG_DIR is required}/app.env
      required: true
  # Only the worker has the volume; the site reads the log's state from the database.
  environment:
    DELETION_LOG_DIRECTORY: /var/lib/fair-shifts-deletion-log
  stop_grace_period: 30s
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    <<: *service
    image: fair-shifts-database:${APP_VERSION:?APP_VERSION is required}
    build:
      context: .
      dockerfile: Dockerfile.database
    env_file:
      - path: ${FAIR_SHIFTS_CONFIG_DIR}/db.env
        required: true
    environment:
      DATABASE_BOOTSTRAP_ACKNOWLEDGEMENT: ""
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/database-bootstrap.sh:/docker-entrypoint-initdb.d/config/database-bootstrap.sh:ro
      - ./scripts/database-bootstrap.sql:/docker-entrypoint-initdb.d/10-service-roles.sql:ro
    networks: [internal]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    <<: *app
    build:
      context: .
      target: production
      args:
        APP_VERSION: ${APP_VERSION}
    networks: [internal, egress]
    # Operations migrates separately; runtime credentials cannot change the schema.
    command:
      [
        sh,
        -c,
        "node scripts/run-command.mjs config:check && node scripts/run-command.mjs db:permissions check && node scripts/run-command.mjs security:secrets verify && exec node_modules/.bin/next start --hostname 0.0.0.0",
      ]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  worker:
    <<: *app
    env_file:
      - path: ${FAIR_SHIFTS_CONFIG_DIR}/worker.env
        required: true
      - path: ${FAIR_SHIFTS_CONFIG_DIR}/worker-secrets.env
        required: true
    environment:
      DELETION_LOG_DIRECTORY: /var/lib/fair-shifts-deletion-log
      SERVICE_ROLE: worker
    pull_policy: never
    # The independent deletion log, outside the database and its backups (decision 196).
    volumes:
      - deletion-log:/var/lib/fair-shifts-deletion-log
      - backup-data:/var/lib/fair-shifts-backups
    networks: [internal, egress]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    command:
      [
        sh,
        -c,
        "node scripts/run-command.mjs config:check && node scripts/run-command.mjs db:permissions check && node scripts/run-command.mjs security:log verify && exec node scripts/run-runtime.mjs src/worker.ts",
      ]
    # The worker touches this file after each maintenance run (every minute).
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('fs').statSync('/tmp/fair-shifts-worker-heartbeat');process.exit(Date.now()-s.mtimeMs<180000?0:1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  operations:
    <<: *app
    profiles: [operations]
    restart: "no"
    env_file:
      - path: ${FAIR_SHIFTS_CONFIG_DIR}/operations.env
        required: true
    volumes:
      - deletion-log:/var/lib/fair-shifts-deletion-log
      - backup-data:/var/lib/fair-shifts-backups
    networks: [internal, egress]
    command:
      [
        sh,
        -c,
        "node scripts/run-command.mjs config:check && node scripts/run-command.mjs db:permissions check && node scripts/run-command.mjs db:migrate && node scripts/run-command.mjs db:permissions apply && node scripts/run-command.mjs security:secrets verify",
      ]

  cloudflared:
    <<: *service
    image: fair-shifts-tunnel:${APP_VERSION:?APP_VERSION is required}
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    command: [tunnel, --no-autoupdate, run]
    env_file:
      - path: ${FAIR_SHIFTS_CONFIG_DIR}/tunnel.env
        required: true
    networks: [egress]
    depends_on:
      app:
        condition: service_healthy

networks:
  # The database has no route outside the host.
  internal:
    internal: true
  egress: {}

volumes:
  postgres-data:
  deletion-log:
  backup-data:
